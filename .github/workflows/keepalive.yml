name: Keepalive

# GitHub switches off scheduled workflows in a public repo after 60 days with
# no activity. This commits a date stamp once a month so the uptime schedule
# never goes quiet. If this ever stops, the README says how to switch it back on.

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Commit a date stamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'Keepalive: monthly stamp so the uptime schedule stays on'
          git push
